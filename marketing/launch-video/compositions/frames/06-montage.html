  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // Beat-locked whip carousel: a cut (whoosh + tick) every 1.5 s.
      var N = 8;
      var SHOT = 1.5;
      var PRE = 0.1; // cut-the-curve: outgoing accelerates over the last 0.1 s of its shot
      var ENTRY = 0.28; // incoming whip-in, expo.out
      var ENTER_X = 700;
      var EXIT_X = -500;
      var CARD_W = 1400;
      var CARD_BLUR = "18 0"; // full-surface streak, x axis only
      var LABEL_BLUR = "12 0"; // display-type streak, x axis only
      var NO_BLUR = "0 0";
      var LABEL_AT = 0.08;
      var LABEL_DUR = 0.14;
      var PH_AT = 0.15;
      var PH_FADE = 0.06;
      var PUSH_DUR = 0.9;
      var PUSH_SCALE = 1.025;

      // playhead span, % of the image width (start, end)
      var SPAN = [
        [23, 60],
        [10, 80],
        [10, 80],
        [10, 80],
        [10, 80],
        [35, 79],
        [10, 80],
        [10, 80],
      ];
      // right card -> label lower-left (opens from its left edge); left card -> label upper-right
      var OPEN_FROM_LEFT = [true, false, true, false, true, false, true, false];

      function el(id) {
        return document.getElementById(id);
      }

      var tl = gsap.timeline({ paused: true, defaults: { lazy: false } });

      for (var i = 0; i < N; i++) {
        var n = i + 1;
        var S = i * SHOT;
        var C = S + SHOT;
        var isLast = i === N - 1;

        var card = el("mtg-card-" + n);
        var cardFx = el("mtg-fxn-c" + n);
        var ph = el("mtg-ph-" + n);
        var label = el("mtg-label-" + n);
        var lbg = el("mtg-lbg-" + n);
        var ltx = el("mtg-ltx-" + n);
        var url = el("mtg-url-" + n);
        var shot = [card, label, url];

        // Hard visibility gate at the cut (URL swaps here too).
        if (i > 0) tl.set(shot, { visibility: "visible" }, S);

        // Whip-in from the right on the beat, streak envelope locked to the same expo.out window.
        tl.fromTo(
          card,
          { x: ENTER_X, opacity: 0.3 },
          { x: 0, opacity: 1, duration: ENTRY, ease: "expo.out" },
          S,
        );
        tl.fromTo(
          cardFx,
          { attr: { stdDeviation: CARD_BLUR } },
          { attr: { stdDeviation: NO_BLUR }, duration: ENTRY, ease: "expo.out" },
          S,
        );

        // One short decelerating push-in, done by +0.9 s, then still.
        tl.fromTo(
          card,
          { scale: 1 },
          { scale: PUSH_SCALE, duration: PUSH_DUR, ease: "power3.out" },
          S,
        );

        // Label slam: green block wipes open from its anchored edge; text revealed in lockstep.
        tl.fromTo(
          lbg,
          { scaleX: 0 },
          { scaleX: 1, duration: LABEL_DUR, ease: "expo.out" },
          S + LABEL_AT,
        );
        tl.fromTo(
          ltx,
          { clipPath: OPEN_FROM_LEFT[i] ? "inset(0% 100% 0% 0%)" : "inset(0% 0% 0% 100%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: LABEL_DUR, ease: "expo.out" },
          S + LABEL_AT,
        );

        // Amber playhead runs linearly across the real waveform until the shot ends.
        var travel = ((SPAN[i][1] - SPAN[i][0]) / 100) * CARD_W;
        tl.fromTo(ph, { opacity: 0 }, { opacity: 1, duration: PH_FADE, ease: "none" }, S + PH_AT);
        tl.fromTo(ph, { x: 0 }, { x: travel, duration: SHOT - PH_AT, ease: "none" }, S + PH_AT);

        // Cut-the-curve exit (not on the final shot, which holds into the hard cut to Frame 7).
        if (!isLast) {
          var labelFx = el("mtg-fxn-l" + n);
          tl.fromTo(
            [card, label],
            { x: 0 },
            { x: EXIT_X, duration: PRE, ease: "power2.in", immediateRender: false },
            C - PRE,
          );
          tl.fromTo(
            [card, label],
            { opacity: 1 },
            { opacity: 0.3, duration: PRE, ease: "none", immediateRender: false },
            C - PRE,
          );
          // blur rides velocity: power2.in position -> quadratic speed -> power1.in envelope
          tl.fromTo(
            cardFx,
            { attr: { stdDeviation: NO_BLUR } },
            { attr: { stdDeviation: CARD_BLUR }, duration: PRE, ease: "power1.in", immediateRender: false },
            C - PRE,
          );
          tl.fromTo(
            labelFx,
