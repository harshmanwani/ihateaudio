  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var FPS = 30;
      var EPS = 0.001;
      var BEAT = 0.5;
      var BEATS = [0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5];

      var DIM = "#385C46";
      var WAVE = "#31D685";
      var AMBER = "#FFBC79";

      var N = 108;
      var MAXH = 300;
      var BANDS = [0, 272, 318, 446, 494, 652, 1080];
      var SIGN = [-1, 1, -1, 1, -1, 1];

      // Pure index-seeded hash, 0..1 (no unseeded noise anywhere).
      function hash(n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }
      function sgn(n) {
        return hash(n) * 2 - 1;
      }
      // Land a step just before its frame / beat so the seek at that time shows it.
      function at(t) {
        return t <= 0 ? 0 : t - EPS;
      }
      function fr(f) {
        return at(f / FPS);
      }

      // Deterministic waveform pattern for beat b: 6-8 bars clip to the ceiling
      // (amber), the next tallest third is wave green, the rest wave-dim.
      function pattern(b) {
        var f1 = 0.9 + hash(b * 3 + 1) * 1.4;
        var p1 = hash(b * 5 + 2);
        var f2 = 2.6 + hash(b * 7 + 3) * 3.2;
        var p2 = hash(b * 11 + 4);
        var raw = [];
        var i;
        for (i = 0; i < N; i++) {
          var x = i / (N - 1);
          var e1 = 0.5 + 0.5 * Math.sin(2 * Math.PI * (x * f1 + p1));
          var e2 = 0.5 + 0.5 * Math.sin(2 * Math.PI * (x * f2 + p2));
          var env = 0.18 + 0.82 * (0.65 * e1 + 0.35 * e2);
          var noise = 0.45 + 0.55 * hash(i * 17.3 + b * 131.7 + 7);
          raw.push(env * noise);
        }
        var order = [];
        for (i = 0; i < N; i++) order.push(i);
        order.sort(function (a, c) {
          return raw[c] - raw[a] || a - c;
        });
        var loud = b === 0 || b === 5 || b === 7; // impact + the two claps
        var K = loud ? 8 : 6 + Math.floor(hash(b * 13 + 5) * 2);
        var ref = raw[order[K]];
        var greens = Math.floor(N / 3);
        var vars = {};
        order.forEach(function (idx, rank) {
          var h;
          var c;
          if (rank < K) {
            h = MAXH;
            c = AMBER;
          } else {
            h = Math.round(MAXH * Math.max(0.05, Math.min(0.88, (raw[idx] / ref) * 0.88)));
            c = rank < K + greens ? WAVE : DIM;
          }
          vars["--hook-h" + idx] = h;
          vars["--hook-c" + idx] = c;
        });
        return vars;
      }

      // ---------- DOM build (synchronous, deterministic) ----------
      var field = document.getElementById("hook-field");
      var main = document.getElementById("hook-main");
      var slicesWrap = document.getElementById("hook-slices");
      var mainScene = main.querySelector(".hook-scene");
      var bars = mainScene.querySelector(".hook-bars");

      for (var i = 0; i < N; i++) {
        var bar = document.createElement("div");
        bar.className = "hook-bar";
        bar.style.height = "max(2px, calc(var(--hook-h" + i + ") * var(--hook-decay) * 1px))";
        bar.style.background = "var(--hook-c" + i + ")";
        bars.appendChild(bar);
      }

      // Beat-0 pattern is the static frame-0 state.
      var p0 = pattern(0);
      Object.keys(p0).forEach(function (k) {
        field.style.setProperty(k, String(p0[k]));
      });
      field.style.setProperty("--hook-decay", "1");

      var slices = [];
      for (var s = 0; s < BANDS.length - 1; s++) {
        var slice = document.createElement("div");
        slice.className = "hook-slice";
        slice.style.clipPath =
          "inset(" + BANDS[s] + "px 0px " + (1080 - BANDS[s + 1]) + "px 0px)";
        slice.appendChild(mainScene.cloneNode(true));
        slicesWrap.appendChild(slice);
        slices.push(slice);
      }

      function all(sel) {
        return Array.prototype.slice.call(field.querySelectorAll(sel));
      }
      var SCENES = all(".hook-scene");
      var L1W = all(".hook-line-1");
      var L1S = all(".hook-line-1 .hook-stack");
      var L2W = all(".hook-line-2");
      var G1g = all(".hook-line-1 .hook-ghost-g");
      var G1a = all(".hook-line-1 .hook-ghost-a");
      var G2g = all(".hook-line-2 .hook-ghost-g");
      var G2a = all(".hook-line-2 .hook-ghost-a");
      var GHOSTS = G1g.concat(G1a, G2g, G2a);
      var MIS = all(".hook-mis");

      // ---------- frame-0 state ----------
      gsap.set(slicesWrap, { opacity: 0 });
      gsap.set(main, { opacity: 1 });
      gsap.set(L1S, { scaleX: 1.32 });
      gsap.set(SCENES, { y: -8 });
      gsap.set(G1g, { x: -8, y: 2, opacity: 0.9 });
      gsap.set(G1a, { x: 8, y: -2, opacity: 0.9 });
      gsap.set(G2g.concat(G2a), { x: 0, y: 0, opacity: 0 });
      gsap.set(MIS, { x: 0, y: 0, rotation: 0 });

      var tl = gsap.timeline({ paused: true });

      // RGB split for one frame on the given lines.
      function split(f, amp, pairs) {
        pairs.forEach(function (pair, li) {
          var k = f * 31 + li * 7;
          var flip = hash(k + 5) < 0.3 ? -1 : 1;
          tl.set(pair[0], { x: -flip * amp * (0.55 + 0.45 * hash(k + 1)), y: amp * 0.35 * sgn(k + 2) }, fr(f));
          tl.set(pair[1], { x: flip * amp * (0.55 + 0.45 * hash(k + 3)), y: amp * 0.35 * sgn(k + 4) }, fr(f));
        });
      }
      var LINE1 = [[G1g, G1a]];
      var BOTH = [[G1g, G1a], [G2g, G2a]];

      // ---------- waveform: steps on every kick, decays between ----------
      for (var b = 1; b < BEATS.length; b++) {
        tl.set(field, pattern(b), at(BEATS[b]));
      }
      // [start, end, floor] decay segments; stutter re-hits gate harder.
      var DECAY = [
        [0.0, 0.5, 0.82],
        [0.5, 1.0, 0.82],
        [1.0, 1.5, 0.82],
        [1.5, 1.75, 0.88],
        [1.75, 1.875, 0.55], // stutter: re-hit the 1.5 pattern
        [1.875, 2.0, 0.55], //  ...twice
        [2.0, 2.5, 0.82],
        [2.5, 3.0, 0.82],
        [3.0, 3.5, 0.82],
        [3.5, 3.625, 0.55], // second stutter
        [3.625, 3.75, 0.55],
        [3.75, 116 / FPS - EPS, 0.6]
      ];
      DECAY.forEach(function (seg) {
        tl.fromTo(
          field,
          { "--hook-decay": 1 },
          { "--hook-decay": seg[2], duration: at(seg[1]) - at(seg[0]), ease: "power2.out" },
          at(seg[0])
        );
      });
      // Last 4 frames: collapse to a flat 2px line.
      [0.32, 0.12, 0.03, 0].forEach(function (v, j) {
        tl.set(field, { "--hook-decay": v }, fr(116 + j));
      });
      var flat = {};
      for (var c = 0; c < N; c++) flat["--hook-c" + c] = WAVE;
      tl.set(field, flat, fr(117));

      // ---------- Scene 1 (0.0): "audio editing" slams in ----------
      tl.fromTo(L1W, { scale: 1.1 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0);
      tl.set(L1S, { scaleX: 1.14 }, fr(1));
      tl.set(L1S, { scaleX: 1.04 }, fr(2));
      tl.set(L1S, { scaleX: 1 }, fr(3));
      split(1, 7, LINE1);
      split(2, 5, LINE1);
      tl.set(GHOSTS, { x: 0, y: 0, opacity: 0 }, fr(3));
      // micro-shake on the impact
      tl.set(SCENES, { y: 6 }, fr(1));
      tl.set(SCENES, { y: -3 }, fr(2));
      tl.set(SCENES, { y: 0 }, fr(3));

      // ---------- Scene 2 (1.0): "is miserable." whips in ----------
      tl.fromTo(L2W, { opacity: 0 }, { opacity: 1, duration: EPS, ease: "none" }, at(1.0));
      tl.fromTo(L2W, { x: 190, skewX: -12 }, { x: 0, skewX: 0, duration: 0.42, ease: "expo.out" }, at(1.0));
      tl.set(SCENES, { y: 7 }, fr(30));
      tl.set(SCENES, { y: -5 }, fr(31));
      tl.set(SCENES, { y: 2 }, fr(32));
      tl.set(SCENES, { y: 0 }, fr(33));

      // "miserable." nervous tic: a new deterministic offset on every frame.
      for (var f = 30; f < 120; f++) {
        tl.set(
          MIS,
          { x: 2.6 * sgn(f * 3 + 1), y: 2.6 * sgn(f * 5 + 2), rotation: 0.6 * sgn(f * 7 + 3) },
          fr(f)
        );
      }

      // ---------- Scene 3 (1.75-2.0): band glitch on the stutter ----------
      var G1 = Math.ceil(1.75 * FPS); // 53
      tl.set(main, { opacity: 0 }, fr(G1));
      tl.set(slicesWrap, { opacity: 1 }, fr(G1));
      tl.set(GHOSTS, { opacity: 0.9 }, fr(G1));
      [G1, G1 + 2, G1 + 4, G1 + 6].forEach(function (sf, st) {
        var flip = st % 2 === 0 ? 1 : -1;
        slices.forEach(function (el, i) {
          tl.set(el, { x: SIGN[i] * flip * (30 + 30 * hash(i * 7 + st * 19 + 3)) }, fr(sf));
        });
      });
      for (var g = G1; g < 60; g++) split(g, 8, BOTH);
      // snap back clean on the 2.0 kick
      tl.set(slices, { x: 0 }, at(2.0));
      tl.set(slicesWrap, { opacity: 0 }, at(2.0));
      tl.set(main, { opacity: 1 }, at(2.0));
      tl.set(GHOSTS, { x: 0, y: 0, opacity: 0 }, at(2.0));

      // ---------- Scene 4 (2.0-3.5): held read ----------
      // Copy holds; jitter and the waveform steps above carry it. No camera move.

      // ---------- Scene 5 (3.5-4.0): bigger glitch, per-frame stutter ----------
      var G2 = 105;
      tl.set(main, { opacity: 0 }, fr(G2));
      tl.set(slicesWrap, { opacity: 1 }, fr(G2));
      tl.set(GHOSTS, { opacity: 0.9 }, fr(G2));
      for (var h = G2; h < 120; h++) {
        var flip5 = hash(h * 13 + 1) < 0.5 ? 1 : -1;
        slices.forEach(function (el, i) {
          var stretch = hash(i * 5 + h * 17 + 9) > 0.6 ? 1 + 0.06 * hash(i * 3 + h * 29 + 2) : 1;
          tl.set(el, { x: SIGN[i] * flip5 * (50 + 30 * hash(i * 11 + h * 23 + 5)), scaleX: stretch }, fr(h));
        });
        split(h, 12 + (10 * (h - G2)) / 14, BOTH);
      }

      window.__timelines["01-hook"] = tl;
    })();
  </script>
