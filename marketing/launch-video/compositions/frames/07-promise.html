  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      // 120 BPM: one beat = 0.5s. Breakdown (no kick) 0.0-2.0, kicks 2.0 / 2.5 / 3.0 / 3.5, riser 3.0-4.0.
      var DURATION = 4;
      var WORD_STEP = 0.06;
      var WORD_DUR = 0.6;

      var WINDOW_IN = 0.1;
      var PLAYHEAD_START = 0.6;
      var PLAYHEAD_END = 2.0;
      var LINE2_START = 2.0;
      var UPLOAD_START = 2.2;
      var STRIKE_AT = 3.0;
      var TRACE_START = 3.2;
      var TRACE_DUR = 0.6;

      // Playhead travel is measured on the rendered image box (838px wide), not the window.
      var SHOT_W = 838;
      var PLAYHEAD_TRAVEL = SHOT_W * (0.70 - 0.22);

      var tl = gsap.timeline({ paused: true });

      // svg-path-draw setup: one dash the measured length of each path, shifted fully out of view.
      // The gap is longer than the path and the hidden offset sits 1px inside it, so a round
      // cap never leaves a dot at the path start before the draw begins.
      function prepDraw(id, fallback) {
        var p = document.getElementById(id);
        var len = (p && p.getTotalLength && p.getTotalLength()) || fallback;
        var dash = len + 0.5;
        var hidden = dash + 1;
        p.style.strokeDasharray = dash + " " + (len + 4);
        p.style.strokeDashoffset = String(hidden);
        return hidden;
      }

      var dashLen = prepDraw("prm-dash-reveal", 51);
      var cloudLen = prepDraw("prm-cloud", 292);
      var shaftLen = prepDraw("prm-arrow-shaft", 39);
      var headLen = prepDraw("prm-arrow-head", 37);
      var traceLen = prepDraw("prm-trace", 2738);

      // Macro camera: a slow upward drift under the whole shot (keeps every overlay aligned).
      tl.fromTo("#prm-stage", { y: 0 }, { y: -10, duration: DURATION, ease: "none" }, 0);

      // Scene 1 (0.0-0.6): line 1 word by word; the browser window rises in at 0.1.
      ["#prm-a1", "#prm-a2", "#prm-a3", "#prm-a4", "#prm-a5"].forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { y: 20, opacity: i === 0 ? 0.4 : 0 },
          { y: 0, opacity: 1, duration: WORD_DUR, ease: "expo.out" },
          i * WORD_STEP
        );
      });

      tl.fromTo(
        "#prm-window",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        WINDOW_IN
      );

      // Scene 2 (0.6-2.0): held read; the amber playhead runs across the real waveform, linear.
      tl.fromTo(
        "#prm-playhead",
        { opacity: 0 },
        { opacity: 1, duration: 0.1, ease: "power1.out" },
        PLAYHEAD_START
      );
      tl.fromTo(
        "#prm-playhead",
        { x: 0 },
        { x: PLAYHEAD_TRAVEL, duration: PLAYHEAD_END - PLAYHEAD_START, ease: "none", immediateRender: false },
        PLAYHEAD_START
      );

      // Scene 3 (2.0-3.0): kick returns. Line 1 dims to 35%, line 2 reveals word by word.
      tl.fromTo(
        "#prm-line1",
        { opacity: 1 },
        { opacity: 0.35, duration: 0.35, ease: "power2.out" },
        LINE2_START
      );
      ["#prm-b1", "#prm-b2", "#prm-b3", "#prm-b4", "#prm-b5", "#prm-b6"].forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: WORD_DUR, ease: "expo.out" },
          LINE2_START + i * WORD_STEP
        );
      });

      // 2.2: the upload path draws itself (svg-path-draw) over 0.4s:
      // dashed line up from the window, then the cloud, then the arrow inside it.
      tl.fromTo(
        "#prm-dash-reveal",
        { strokeDashoffset: dashLen },
        { strokeDashoffset: 0, duration: 0.16, ease: "none" },
        UPLOAD_START
      );
      tl.fromTo(
        "#prm-cloud",
        { strokeDashoffset: cloudLen },
        { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" },
        UPLOAD_START + 0.12
      );
      tl.fromTo(
        "#prm-arrow-shaft",
        { strokeDashoffset: shaftLen },
        { strokeDashoffset: 0, duration: 0.14, ease: "power2.out" },
        UPLOAD_START + 0.2
      );
      tl.fromTo(
        "#prm-arrow-head",
        { strokeDashoffset: headLen },
        { strokeDashoffset: 0, duration: 0.12, ease: "power2.out" },
        UPLOAD_START + 0.28
      );

      // Scene 4 (3.0-4.0): on the beat, the amber strike slashes through the cloud and the line;
      // the upload path fades to 30%.
      tl.fromTo(
        "#prm-strike",
        { scaleX: 0, rotation: -12, transformOrigin: "0% 50%" },
        { scaleX: 1, rotation: -12, transformOrigin: "0% 50%", duration: 0.15, ease: "power2.out" },
        STRIKE_AT
      );
      tl.fromTo(
        "#prm-upload",
        { opacity: 1 },
        { opacity: 0.3, duration: 0.3, ease: "power1.out" },
        STRIKE_AT + 0.1
      );

      // 3.2: a 4px brand-green outline traces the browser window's perimeter. Hold to 4.0.
      tl.fromTo(
        "#prm-trace",
        { strokeDashoffset: traceLen },
        { strokeDashoffset: 0, duration: TRACE_DUR, ease: "power2.inOut" },
        TRACE_START
      );

      window.__timelines["07-promise"] = tl;
    })();
