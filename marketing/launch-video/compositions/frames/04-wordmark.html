  <div data-hf-id="hf-fp4n" id="root" data-composition-id="04-wordmark" data-width="1920" data-height="1080" data-duration="2">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Logo geometry from assets/brand/logo.svg (32-unit grid). Every bar is centred on y = 16.
      var BARS = [
        { y: 12, h: 8 },
        { y: 8, h: 16 },
        { y: 1, h: 30 },
        { y: 9, h: 14 },
        { y: 12, h: 8 }
      ];
      var CY = 16;
      var bars = document.querySelectorAll("#wm-logo .wm-bar");
      var letters = document.querySelectorAll("#wm-word .wm-ch");

      // Scene 1 (0.0-0.45s): the tile slams in on the DROP at 0.0.
      // 2-frame shake: frame 0 offset, frame 1 opposite offset, frame 2 at rest.
      var wmShakeEase = function (p) {
        return p < 0.2 ? 0 : p < 0.55 ? 1.8 : 1;
      };
      tl.fromTo("#wm-mark", { x: -10, y: 5 }, { x: 0, y: 0, duration: 0.1, ease: wmShakeEase }, 0);
      // Slam: scale 1.35 -> 1.0, long-tail settle, no overshoot.
      tl.fromTo("#wm-tile", { scale: 1.35 }, { scale: 1, duration: 0.45, ease: "expo.out" }, 0);

      // Bars grow from 0 height about their centre, left -> right 0.04s apart, middle bar last.
      var GROW_ORDER = [0, 1, 3, 4, 2];
      GROW_ORDER.forEach(function (bi, k) {
        var b = BARS[bi];
        tl.fromTo(
          bars[bi],
          { attr: { y: CY, height: 0 } },
          { attr: { y: b.y, height: b.h }, duration: 0.26, ease: "expo.out" },
          0.03 + k * 0.04
        );
      });

      // Scene 2 (0.15-0.75s): the wordmark cascades in letter by letter.
      for (var i = 0; i < letters.length; i++) {
        tl.fromTo(
          letters[i],
          { y: 50, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" },
          0.15 + i * 0.035
        );
      }

      // Scene 3 (0.75-2.0s): held lockup. The bars pulse on the kicks at 1.0 and 1.5:
      // height jumps +18% on the kick frame, then settles back within 0.25s, 0.02s stagger.
      var PULSE = 1.18;
      [1.0, 1.5].forEach(function (T) {
        BARS.forEach(function (b, bi) {
          var H = b.h * PULSE;
          tl.fromTo(
            bars[bi],
            { attr: { y: CY - H / 2, height: H } },
            { attr: { y: b.y, height: b.h }, duration: 0.25, ease: "power3.out", immediateRender: false },
            T + bi * 0.02
          );
        });
      });

      window.__timelines["04-wordmark"] = tl;
    })();
  </script>
