    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";

        var FPS = 30;
        var TOTAL = 49;
        // Music hits (local seconds, 120 BPM, one beat = 0.5s).
        var COUNT_END = 1.0; // thud + crash: "49" lands, grid punch, "audio tools."
        var FREE_AT = 1.5; // thud: "free." stamps in
        var APPEAR = 0.002; // near-instant opacity cut that completes exactly on a hit

        // Discrete per-frame steps sit half a frame early so float seek times
        // can never skip them; frame n shows the step placed at stepAt(n).
        function stepAt(frame) {
          return (frame - 0.5) / FPS;
        }

        // Index-seeded deterministic noise in [-1, 1] (no Math.random).
        function noise(i, salt) {
          var s = Math.sin(i * 12.9898 + salt * 78.233) * 43758.5453;
          return (s - Math.floor(s)) * 2 - 1;
        }

        var num = document.getElementById("cnt-num");
        var grid = document.getElementById("cnt-grid");
        var icons = Array.prototype.slice.call(grid.querySelectorAll(".cnt-icon"));
        var tools = document.getElementById("cnt-tools");
        var freeJit = document.getElementById("cnt-free-jit");
        var free = document.getElementById("cnt-free");

        var tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0–1.0): counting-dynamic-scale ──────────────────────
        // Underlying value v(t) = 49 * (t / 1.0)^2  (power2.in, accelerating).
        // Display = Math.round(v): integer n shows from v = n - 0.5, so it is
        // set at t = sqrt((n - 0.5) / 49). 49 is pinned to land on 1.0.
        num.textContent = "0";
        for (var n = 1; n <= TOTAL; n++) {
          var at =
            n === TOTAL ? COUNT_END - 0.001 : COUNT_END * Math.sqrt((n - 0.5) / TOTAL);
          tl.set(num, { textContent: String(n) }, at);
        }
        // Size grows with the value: 60% -> 100% of 400px, same ease + span as the count.
        tl.fromTo(num, { scale: 0.6 }, { scale: 1, duration: COUNT_END, ease: "power2.in" }, 0);

        // Icon k (reading order) pops as the value passes k: t = sqrt(k / 49).
        icons.forEach(function (icon, k) {
          if (k === 0) {
            // First icon is on screen at frame 0: start it one frame into the
            // standard pop (power3.out at 1/30 of 0.12s ~ 62%).
            tl.fromTo(
              icon,
              { scale: 0.74, opacity: 0.62 },
              { scale: 1, opacity: 1, duration: 0.12 - 1 / FPS, ease: "power3.out" },
              0,
            );
            return;
          }
          tl.fromTo(
            icon,
            { scale: 0.3, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.12, ease: "power3.out" },
            COUNT_END * Math.sqrt(k / TOTAL),
          );
        });

        // ── Scene 2 (1.0–1.5): grid punch + "audio tools." slam ────────────
        tl.fromTo(grid, { scale: 1 }, { scale: 1.05, duration: 0.08, ease: "power3.out" }, COUNT_END);
        tl.to(grid, { scale: 1, duration: 0.17, ease: "power2.out" }, COUNT_END + 0.08);

        // kinetic-beat-slam, phrase 1: side snap with a blur that resolves.
        tl.fromTo(
          tools,
          { opacity: 0 },
          { opacity: 1, duration: APPEAR, ease: "none" },
          COUNT_END - APPEAR,
        );
        tl.fromTo(
          tools,
          { x: -110, filter: "blur(14px)" },
          { x: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out", immediateRender: false },
          COUNT_END,
        );

        // ── Scene 3 (1.5–2.5): "free." stamp + 3-frame shake + jitter hold ─
        // kinetic-beat-slam, phrase 2: scale stamp 1.6 -> 1.0, held at -3deg.
        tl.fromTo(
          free,
          { opacity: 0 },
          { opacity: 1, duration: APPEAR, ease: "none" },
          FREE_AT - APPEAR,
        );
        tl.fromTo(
          free,
          { scale: 1.6, rotation: -3 },
          { scale: 1, rotation: -3, duration: 0.22, ease: "power4.out", immediateRender: false },
          FREE_AT,
        );

        // 3-frame shake on the landing (frames 47, 48, 49), reset on frame 50.
        var hitFrame = Math.round(FREE_AT * FPS); // 45
        var SHAKE = [
          [12, -5],
          [-9, 4],
          [5, -2],
        ];
        SHAKE.forEach(function (s, i) {
          tl.set(freeJit, { x: s[0], y: s[1], rotation: 0 }, stepAt(hitFrame + 2 + i));
        });
        tl.set(freeJit, { x: 0, y: 0, rotation: 0 }, stepAt(hitFrame + 5));

        // Subtle stepped jitter on "free." only, every 2 frames to the end;
        // the step on the 2.0 kick (frame 60) is a touch stronger.
        var lastFrame = Math.round(2.5 * FPS) - 1; // 74
        for (var f = hitFrame + 7, j = 0; f <= lastFrame; f += 2, j++) {
          var amp = f === 60 ? 2.6 : 1.5;
          tl.set(
            freeJit,
            {
              x: noise(j, 1) * amp,
              y: noise(j, 2) * amp,
              rotation: noise(j, 3) * 0.35,
            },
            stepAt(f),
          );
        }

        window.__timelines = window.__timelines || {};
        window.__timelines["05-count"] = tl;
      })();
    </script>
