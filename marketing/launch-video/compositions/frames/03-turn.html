      // Beat map (120 BPM, 1 beat = 0.5 s), local seconds.
      var BELL = 0.0;              // clean bell chord: per-word reveal
      var WORD_STEP = 0.07;        // 4 words at 0.00 / 0.07 / 0.14 / 0.21
      var WORD_DUR = 0.5;
      var RISER_START = 0.5;       // riser 0.5 -> 1.95: line draws

      var tl = gsap.timeline({ paused: true });

      var len = (path && path.getTotalLength && path.getTotalLength()) || 1680;
