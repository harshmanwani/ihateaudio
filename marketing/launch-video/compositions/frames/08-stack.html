  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      // ---- One tempo grid drives everything (120 BPM, one beat = 0.5 s) ----
      var FPS = 30;
      var F = 1 / FPS; // one frame
      var BEAT = 0.5;
      var HITS = [0 * BEAT, 2 * BEAT, 4 * BEAT]; // 0.0 crash, 1.0 thud, 2.0 thud
      var END = 3.0;
      var PRE = 0.012; // an "on the hit frame" switch finishes just before the hit

      var tl = gsap.timeline({ paused: true });

      // Index-seeded deterministic noise in [0, 1).
      function hash(n) {
        var s = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
        return s - Math.floor(s);
      }

      // Make a hidden line visible exactly on its hit frame (and not one frame before).
      function appearOn(sel, t) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, t - PRE);
      }

      // 2-frame impact shake on the slamming line: frames t+1, t+2 offset, t+3 home.
      function shake(sel, t, pts) {
        var prev = { x: 0, y: 0 };
        pts.concat([{ x: 0, y: 0 }]).forEach(function (p, i) {
          tl.fromTo(
            sel,
            { x: prev.x, y: prev.y },
            { x: p.x, y: p.y, duration: F, ease: "none", immediateRender: false },
            t + i * F
          );
          prev = p;
        });
      }

      // 2-frame 6px down-punch on a line above: down on frames t and t+1, home on t+2.
      function punch(sel, t) {
        tl.fromTo(sel, { y: 0 }, { y: 6, duration: 0.01, ease: "none", immediateRender: false }, t - PRE);
        tl.fromTo(sel, { y: 6 }, { y: 0, duration: F, ease: "none", immediateRender: false }, t + F);
      }

      // Subtle hold jitter: a stepped 15 fps boil (every 2 frames), +-1.4px x, +-1.1px y.
      function jitter(sel, seed, from) {
        var startFrame = Math.ceil((from * FPS) / 2) * 2;
        var endFrame = Math.round(END * FPS);
        var px = 0, py = 0;
        for (var fr = startFrame; fr < endFrame; fr += 2) {
          var nx = (hash(seed * 997 + fr * 1.37) * 2 - 1) * 1.4;
          var ny = (hash(seed * 577 + fr * 2.11 + 31.7) * 2 - 1) * 1.1;
          tl.fromTo(
            sel,
            { x: px, y: py },
            { x: nx, y: ny, duration: 0.006, ease: "none", immediateRender: false },
            fr / FPS - 0.008
          );
          px = nx;
          py = ny;
        }
      }

      // ---- Scene 1 (0.0-1.0): "no signup." slams in on the impact + crash ----
      // Scale + blur slam, expo.out. Visible on frame 0 (the cut lands on the crash).
      tl.fromTo(
        "#stk-w1",
        { scale: 1.3, filter: "blur(8px)", opacity: 1 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "expo.out" },
        HITS[0]
      );
      shake("#stk-s1", HITS[0], [{ x: 9, y: -3 }, { x: -6, y: 2 }]);
      jitter("#stk-j1", 1, HITS[0] + 0.4);

      // ---- Scene 2 (1.0-2.0): "no watermark." drops onto its line on the thud ----
      // Scale slam + drop from above, power4.out. The line above takes a down-punch.
      appearOn("#stk-w2", HITS[1]);
      tl.fromTo(
        "#stk-w2",
        { scale: 1.3, y: -36, filter: "blur(7px)" },
        { scale: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        HITS[1]
      );
      shake("#stk-s2", HITS[1], [{ x: -4, y: 8 }, { x: 3, y: -5 }]);
      punch("#stk-l1", HITS[1]);
      jitter("#stk-j2", 2, HITS[1] + 0.4);

      // ---- Scene 3 (2.0-3.0): "no limits." whips in from the right on the thud ----
      // Scale slam + side snap (expo.out); the lean straightens on a longer power3.out tail.
      appearOn("#stk-w3", HITS[2]);
      tl.fromTo(
        "#stk-w3",
        { scale: 1.3, x: 72, filter: "blur(7px)" },
        { scale: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" },
        HITS[2]
      );
      tl.fromTo(
        "#stk-w3",
        { skewX: -8 },
        { skewX: 0, duration: 0.6, ease: "power3.out", immediateRender: false },
        HITS[2]
      );
      shake("#stk-s3", HITS[2], [{ x: -9, y: 3 }, { x: 6, y: -2 }]);
      punch("#stk-l1", HITS[2]);
      punch("#stk-l2", HITS[2]);
      jitter("#stk-j3", 3, HITS[2] + 0.4);

      // Hold to 3.0: the stepped jitter above is the only motion. No exit.

      window.__timelines["08-stack"] = tl;
